# Selfhost Kit: synced from tyler-class/selfhost-kit (kit/workflows/update.yml).
# Keeps a copy made with the Deploy to Cloudflare button up to date with tyler-class/ratio.
# The button makes a plain copy (not a fork) and leaves this file out, so Ratio's Settings →
# Updates offers to add it. Each run brings the latest Ratio into this repo and pushes; that
# push is what Cloudflare deploys from. Ratio never deploys to your Cloudflare directly.
# Your data lives in the database and file storage, not here, so it isn't touched.
name: Update Ratio

on:
  schedule:
    - cron: '23 9 * * 1' # Mondays
  # "Update now" in Ratio's Settings opens this workflow's Run button.
  workflow_dispatch:
  # Adding (or changing) this file runs it once straight away.
  push:
    paths: ['.github/workflows/update.yml']

# One run at a time. A run started while another is going (Update now right after setting up
# updates, say) waits for it, then finds there's nothing new instead of failing at the push.
concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write
  # For the keep-alive step below.
  actions: write

jobs:
  update:
    # Only in copies, never in Ratio itself.
    if: github.repository != 'tyler-class/ratio'
    runs-on: ubuntu-latest
    steps:
      # The branch as it is now, not the commit that started the run: a run that waited for
      # another one starts from that run's update.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - name: Take the latest Ratio
        run: |
          git fetch --depth=1 https://github.com/tyler-class/ratio.git main
          upstream=$(git rev-parse FETCH_HEAD)

          # Kept from this copy: its workflows (GitHub doesn't let this job change them) and its
          # name, ids and resource names in wrangler.jsonc (merged into the new config below).
          keep=$(mktemp -d)
          cp -r .github/workflows "$keep/workflows"
          cp wrangler.jsonc "$keep/"

          git rm -rq .
          git checkout "$upstream" -- .
          rm -rf .github/workflows && cp -r "$keep/workflows" .github/workflows
          # The new config (crons, bindings) with this copy's name, ids and resource names kept.
          node scripts/kit/merge-wrangler.mjs "$keep/wrangler.jsonc" wrangler.jsonc
          git add -A

          if git diff --cached --quiet; then
            echo "Already up to date."
            exit 0
          fi
          # GitHub doesn't let this job change workflow files, so a newer version of this one
          # has to be copied in by hand. Only said when it's actually different.
          if ! git diff --quiet "$upstream" HEAD -- .github/workflows/update.yml 2>/dev/null; then
            echo "::notice::There's a newer version of this update workflow. Replace .github/workflows/update.yml with the one in tyler-class/ratio to get it."
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "Update Ratio to ${upstream:0:7}"
          git push

      # GitHub turns off scheduled workflows in a repo with no activity for 60 days, and this one
      # only commits when there's a new version. Re-enabling it on every run resets that timer,
      # so the weekly check never switches itself off.
      - name: Keep this workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
